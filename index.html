<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birds Seen Near Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="container">
    <h1>Birds Seen Near You</h1>

    <div id="controls" class="controls">
      <button id="filters-btn" class="filters-btn hidden">Filters</button>
    </div>

    <div id="birds" class="birds-grid"></div>

    <div class="attribution">
      Data provided by <a href="https://ebird.org" target="_blank">eBird</a> (Cornell Lab of Ornithology)
    </div>
  </div>

  <!-- Filter side panel (hidden by default) -->
  <div id="filter-backdrop" class="filter-backdrop" aria-hidden="true"></div>
  <aside id="filter-panel" class="filter-panel" aria-hidden="true">
    <div class="filter-panel-inner">
      <button id="close-filters" class="close-filters" aria-label="Close filters">×</button>
      <h3>Filters</h3>

      <div class="filter-section">
        <label>Location</label>
        <div id="filter-map" style="height:240px"></div>
        <div id="filter-coords" class="filter-coords">Click on the map to set location</div>
      </div>

      <div class="filter-section">
        <label for="filter-distance">Distance (miles)</label>
        <input id="filter-distance" type="number" min="1" max="100" value="10" />
        <div class="hint">Max 100 Miles</div>
      </div>

      <div class="filter-section">
        <label>Time Since Sighting</label>
        <div id="filter-time" class="filter-time">
          <button data-days="0.5">12 Hours</button>
          <button data-days="1">1 Day</button>
          <button data-days="2">2 Days</button>
          <button data-days="3">3 Days</button>
          <button data-days="4">4 Days</button>
          <button data-days="7">Last Week</button>
        </div>
      </div>

      <div class="filter-section">
        <label for="select-input">Select Birds</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="select-input" list="species-datalist" placeholder="Type a bird name..." />
          <button id="add-species" class="reset-filters" type="button">Add</button>
        </div>
        <datalist id="species-datalist"></datalist>
        <div id="selected-species" class="selected-species" aria-live="polite"></div>
      </div>

      <div class="filter-actions">
        <button id="reset-filters" class="reset-filters">Reset Filters</button>
        <button id="apply-filters" class="apply-filters">Apply Filters</button>
      </div>
    </div>
  </aside>

  <!-- Select UI is embedded inside the Filters panel -->

  <!-- Leaflet script (for the filter map) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
